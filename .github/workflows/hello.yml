name: Validate Streamlit App

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: pip install flake8

      - run: flake8 .

      - run: pip install bandit

      - run: bandit -r .